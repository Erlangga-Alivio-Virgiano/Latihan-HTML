<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Tanpa Tabel</title>
    <style>
        .form-container {
            display: inline-block;
            font-family: serif;
        }
        .form-group {
            margin-bottom: 8px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .form-group label {
            margin-right: 8px;
        }
        .center-group {
            text-align: center;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-group">
        <label>Text :</label>
        <input type="text">
    </div>
    <div class="form-group">
        <label>Password :</label>
        <input type="password">
    </div>
    <div class="center-group">
        Radio 1 <input type="radio" name="radio2" checked> 
        Radio 2 <input type="radio" name="radio2">
    </div>
    <div class="center-group">
        checkbox 1 <input type="checkbox" checked> 
        checkbox 2 <input type="checkbox" checked>
    </div>
    <div class="form-group">
        <label>Combo Box :</label>
        <select>
            <option>Option 1</option>
            <option>Option 2</option>
        </select>
    </div>
    <div class="form-group" style="align-items: flex-start;">
        <label>Textarea :</label>
        <textarea rows="3" cols="20"></textarea>
    </div>
    <div class="center-group">
        <button type="button">Button</button>
    </div>
</div>
<a href="index.html">kembali</a>
</body>
</html>
