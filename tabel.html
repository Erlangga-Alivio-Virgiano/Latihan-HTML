<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>5 Tabel HTML</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            padding: 30px;
        }

        table {
            border-collapse: collapse;
            width: 240px;
            height: 180px;
        }

        td {
            border: 2px solid black;
            text-align: center;
            font-size: 25px;
        }
    </style>
</head>

<body>
<h1>Tugas Tabel</h1>
<div class="container">
    <table>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>

        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>

        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tr>
    </table>

    <table>
        <tr>
            <td>1</td>
            <td colspan="2">2</td>
        </tr>

        <tr>
            <td>3</td>
            <td>4</td>
            <td>5</td>
        </tr>

        <tr>
            <td>6</td>
            <td>7</td>
            <td>8</td>
        </tr>
    </table>

    <table>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>

        <tr>
            <td colspan="3">4</td>
        </tr>

        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
        </tr>
    </table>

    <table>
        <tr>
            <td>1</td>
            <td colspan="2">2</td>
        </tr>

        <tr>
            <td>3</td>
            <td>4</td>
            <td>5</td>
        </tr>

        <tr>
            <td colspan="2">6</td>
            <td>7</td>
        </tr>
    </table>

    <table>
        <tr>
            <td rowspan="2">1</td>
            <td>2</td>
            <td rowspan="2">4</td>
        </tr>

        <tr>
            <td>3</td>
        </tr>

        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
        </tr>
    </table>
</div>
<a href="index.html">kembali</a>
</body>
</html>
