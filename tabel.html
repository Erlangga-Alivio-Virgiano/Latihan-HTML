<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Tabel</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: Times New Roman, serif;
            font-size: 18px;
        }
        td {
            border: 1px solid black;
            padding: 5px 10px;
        }
        .text-right {
            text-align: right;
        }
        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <td class="text-right">Text :</td>
        <td><input type="text"></td>
    </tr>
    <tr>
        <td class="text-right">Password :</td>
        <td><input type="password"></td>
    </tr>
    <tr>
        <td class="text-right">Radio 1 <input type="radio" name="r" checked></td>
        <td>Radio 2 <input type="radio" name="r"></td>
    </tr>
    <tr>
        <td class="text-right">checkbox 1 <input type="checkbox" checked></td>
        <td>checkbox 2 <input type="checkbox" checked></td>
    </tr>
    <tr>
        <td class="text-right">Combo Box :</td>
        <td>
            <select>
                <option>Option 1</option>
            </select>
        </td>
    </tr>
    <tr>
        <td class="text-right" style="vertical-align: top;">Textarea :</td>
        <td><textarea rows="3" cols="20"></textarea></td>
    </tr>
    <tr>
        <td colspan="2" class="text-center">
            <button type="button">Button</button>
        </td>
    </tr>
</table>
<a href="index.html">kembali</a>
</body>
</html>
